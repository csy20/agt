name: agt

services:
  postgres:
    image: postgres:16-alpine
    container_name: agt-postgres
    environment:
      POSTGRES_USER: agt
      POSTGRES_PASSWORD: agt
      POSTGRES_DB: agt
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agt -d agt"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - agt-pg:/var/lib/postgresql/data

volumes:
  agt-pg:
